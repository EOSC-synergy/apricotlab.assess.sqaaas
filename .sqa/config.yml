config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/apricotlab:
      branch: main
      repo: https://github.com/grycap/apricotlab/
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/apricotlab git:
        commands:
        - /usr/bin/env sh .sqa/script.vermilion_fierce_clownfish.sh
        container: qc.acc_cinnamon_open_spren
  QC.Doc:
    repos:
      github.com/grycap/apricotlab find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.mauve_radiant_lionfish.sh
        container: qc.doc_snow_realistic_reindeer
      github.com/grycap/apricotlab git:
        commands:
        - /usr/bin/env sh .sqa/script.cosmos_organized_chinchilla.sh
        container: qc.doc_rosewater_jubilant_cormorant
      github.com/grycap/apricotlab markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.saffron_grumpy_frog.sh
        container: qc.doc_sunset_foolish_crane
  QC.Lic:
    repos:
      github.com/grycap/apricotlab licensee:
        commands:
        - /usr/bin/env sh .sqa/script.sepia_vigilant_tortoise.sh
        container: qc.lic_mint_mischievous_llama
