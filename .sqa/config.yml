        - /usr/bin/env sh .sqa/script.aqua_meticulous_cheetah.sh
        container: qc.doc_umber_hopeful_tortoise
      github.com/grycap/apricotlab git:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_forgiving_griffin.sh
