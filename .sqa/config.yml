config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/apricotlab:
      branch: main
      repo: https://github.com/grycap/apricotlab/
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/apricotlab git:
        commands:
        - /usr/bin/env sh .sqa/script.plum_sincere_moose.sh
        container: qc.acc_pearl_determined_seal
  QC.Doc:
    repos:
      github.com/grycap/apricotlab find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.purple_dreamy_phoenix.sh
        container: qc.doc_boysenberry_carefree_lynx
      github.com/grycap/apricotlab git:
        commands:
        - /usr/bin/env sh .sqa/script.jasmine_optimistic_albatross.sh
        container: qc.doc_jade_rugged_dragonfly
      github.com/grycap/apricotlab markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.clove_funny_nighthawk.sh
        container: qc.doc_tangerine_rustic_jellyfish
  QC.Lic:
    repos:
      github.com/grycap/apricotlab licensee:
        commands:
        - /usr/bin/env sh .sqa/script.burgundy_responsible_elephant.sh
        container: qc.lic_pineapple_mindful_whale
